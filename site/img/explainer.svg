<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why the sea rises: warmer water expands, land ice melts, and the sea reaches further inland"><style>svg{--bg:#f6f6f3;--card:#ffffff;--ink:#16181c;--muted:#5a6068;--line:#dedfd9;--ground:#e7e4da;
